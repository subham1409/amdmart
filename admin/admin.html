<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMD Mart – Admin</title>
<link rel="icon" href="https://i.ibb.co/tpyCskfp/75-C80-FC1-2585-45-E3-BF9-A-DBAFA069-ED0-B.png">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header><div class="brand"><img src="https://i.ibb.co/tpyCskfp/75-C80-FC1-2585-45-E3-BF9-A-DBAFA069-ED0-B.png" alt=""><h1>AMD <span>Mart</span> Admin</h1></div><div><a href="../index.html">← Store</a> <button id="out" class="hidden">Logout</button></div></header>

<section id="login" class="box hidden">
  <h2>Admin Login</h2>
  <form id="login-f"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Login</button></form>
</section>
<p id="denied" class="box hidden">⛔ This account is not an admin. Admins are added manually in the Firebase Console at <code>admins/&lt;uid&gt;: true</code>.</p>

<main id="panel" class="hidden">
  <nav class="tabs"><button data-t="products" class="on">Products</button><button data-t="requests">Requests</button><button data-t="users">Users</button><button data-t="categories">Categories</button></nav>
  <div id="stats" class="stats"></div>
  <div id="content" class="box"></div>
</main>

<dialog id="ed">
  <form id="ed-f">
    <h2>Edit product</h2>
    <label>Title<input name="title" maxlength="100" required></label>
    <div class="row2">
      <label>Listed price (₹)<input name="price" type="number" min="0" max="10000000" step="1" required></label>
      <label>Original price / MRP (₹)<input name="originalPrice" type="number" min="0" step="1"></label>
    </div>
    <div class="comm">
      <b>Commission</b>
      <span>Seller's price: <strong id="ed-base">₹0</strong></span>
      <div class="row2">
        <select name="ctype"><option value="pct">% of seller's price</option><option value="flat">Flat ₹</option></select>
        <input name="cval" type="number" min="0" step="0.5" placeholder="e.g. 10">
      </div>
      <button type="button" id="ed-apply" class="gray">Apply to listed price</button>
      <small id="ed-prev"></small>
    </div>
    <div class="row2">
      <label>Category<select name="category" required></select></label>
      <label>Condition<select name="condition"></select></label>
    </div>
    <label>Area / location<input name="location" maxlength="100"></label>
    <label>Description<textarea name="description" rows="3" maxlength="2000"></textarea></label>
    <div class="row2">
      <label>Status<select name="status"><option value="active">active</option><option value="sold">sold</option></select></label>
      <label class="chk"><input name="verified" type="checkbox"> Verified</label>
    </div>
    <div class="acts"><button type="button" class="gray" id="ed-cancel">Cancel</button><button>Save changes</button></div>
  </form>
</dialog>
<script type="module" src="admin.js"></script>
</body>
</html>
