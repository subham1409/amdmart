<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMD Mart – Ahmedabad Students' Marketplace</title>
<link rel="icon" href="https://i.ibb.co/qL84QwQm/A6-E453-B6-2581-4-D2-B-B99-F-C6-C82-FF4-FE6-A.png">
<style>
:root{--o:#f26a0f;--o2:#ffece0;--d:#161616;--g:#777;--bg:#fff8f5;--r:18px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:#e9e4e1;color:var(--d)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
.hidden{display:none!important}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.o{color:var(--o)}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding:0 16px 120px;position:relative}
.pad{padding:8px 0}

.top{display:flex;justify-content:space-between;align-items:center;padding:8px 0 4px}
.brand{display:flex;gap:8px;align-items:center}.brand img{width:36px}
.brand h1{font-size:22px;line-height:1}.brand h1 span{color:var(--o)}.brand small{font-size:11px}
.top-r{display:flex;gap:4px;align-items:center}
.pill{display:flex;align-items:center;gap:4px;background:var(--o2);padding:9px 14px;border-radius:30px;font-weight:600;font-size:14px}.pill .ic{width:18px;height:18px;color:var(--o)}
.icon-btn{position:relative;display:grid;place-items:center;width:36px;height:36px}
.dot{position:absolute;top:5px;right:7px;width:9px;height:9px;background:#e53935;border-radius:50%;border:2px solid var(--bg)}

.hero{background:linear-gradient(110deg,#151515 45%,#b34a0a 100%);color:#fff;border-radius:var(--r);padding:22px 16px 22px 20px;display:flex;justify-content:space-between;align-items:center;overflow:hidden;margin:6px 0 14px}
.hero h2{font:italic 700 25px/1.12 Georgia,serif}.hero h2 span{color:var(--o)}
.hero .tag{display:block;margin-top:1px;font-size:11.5px;letter-spacing:.3px;color:rgba(255,255,255,.72)}
.hero p{margin-top:12px;font-size:13px}.hero b{color:var(--o)}
.hero{position:relative;min-height:150px}
.hero>div:first-child{position:relative;z-index:2}
.hero-art{position:absolute;right:0;top:0;height:100%;width:68%;z-index:0;opacity:.55;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 42%);mask-image:linear-gradient(90deg,transparent 0,#000 42%)}
/* Optional real photo: save any Ahmedabad photo as hero.jpg next to index.html and it fades in over the drawing automatically */
.hero::after{content:"";position:absolute;right:0;top:0;height:100%;width:68%;z-index:1;pointer-events:none;background:url("hero.jpg") center/cover no-repeat;opacity:.55;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 45%);mask-image:linear-gradient(90deg,transparent 0,#000 45%)}
.search{display:flex;align-items:center;gap:10px;width:100%;padding:0 18px;border-radius:30px;background:#f1e9e6;box-shadow:inset 0 1px 3px #0002;margin-bottom:16px;color:var(--g)}
.search input{border:0;background:none;outline:none;padding:15px 0;width:100%;color:var(--d)}

.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:22px}
.cat{background:var(--o2);border-radius:16px;padding:12px 2px 10px;text-align:center;font-size:12px;font-weight:500;min-height:84px;display:flex;flex-direction:column;align-items:center;gap:6px}
.cat i{color:var(--o);display:grid;place-items:center}.cat .ic{width:30px;height:30px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-h h3{display:flex;align-items:center;gap:6px}.sec-h a{color:var(--o);font-weight:600;text-decoration:none}

.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin:0 -16px;padding-left:16px;scrollbar-width:none}
.hscroll .card{min-width:158px;max-width:158px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #0001;position:relative;cursor:pointer}
.imgw{position:relative}.card .img{height:110px;background:#eee center/cover}
.card .info{padding:8px 10px 10px;font-size:13px}.card .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.price{color:var(--o);font-weight:700;font-size:16px}.price s{color:#999;font-size:11px;font-weight:400;margin-left:4px}
.loc{display:flex;align-items:center;gap:3px;color:var(--g);font-size:11px;margin-top:2px}.loc .ic{width:13px;height:13px}
.ver{position:absolute;left:6px;bottom:6px;background:var(--o);color:#fff;font-size:10px;padding:3px 8px;border-radius:12px}
.heart{position:absolute;right:6px;top:6px;background:#fffe;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;color:#555}
.heart .ic{width:16px;height:16px}.heart.on{color:#e53935}.heart.on .ic{fill:#e53935}
.sold{position:absolute;inset:0 0 auto 0;background:#000a;color:#fff;text-align:center;font-size:12px;padding:3px}

.btn{background:var(--o);color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:disabled{opacity:.5}.btn.ghost{background:var(--o2);color:var(--o)}.btn.red{background:#d33}.btn.sm{padding:7px 12px;font-size:13px}.btn.full{width:100%}

.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;scrollbar-width:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:20px;background:var(--o2);font-size:13px}.chip.on{background:var(--o);color:#fff}
.list{display:flex;flex-direction:column;gap:10px}
.row{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 8px #0001;font-size:14px}
.row .act{margin-top:8px;display:flex;gap:8px}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--o2);color:var(--o);font-weight:600}
.empty{text-align:center;color:var(--g);padding:30px 0;grid-column:1/-1}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:grid;grid-template-columns:1fr 1fr 1.5fr 1fr 1fr;align-items:end;padding:8px 0 10px;box-shadow:0 -2px 12px #0002;z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:#555;gap:3px}
.nav button.on{color:var(--o);font-weight:700}
.nav .fab{color:var(--o);font-weight:600;white-space:nowrap;font-size:11px}
.fab-c{width:58px;height:58px;border-radius:50%;background:var(--o);color:#fff;display:grid;place-items:center;margin-top:-34px;border:4px solid #fff;box-shadow:0 4px 12px #f26a0f66}
.fab-c .ic{width:28px;height:28px;stroke-width:2.2}

dialog{border:0;border-radius:20px;padding:20px;width:min(92vw,440px);max-height:90vh;overflow:auto;margin:auto}
dialog::backdrop{background:#0008}.x{position:absolute;right:16px;top:12px;font-size:18px;color:#666}
dialog h3{margin-bottom:12px}
form{display:flex;flex-direction:column;gap:10px}
form input,form select,form textarea{padding:12px;border:1px solid #ddd;border-radius:10px;width:100%}
.dgrid{display:block}
.detail-img{height:220px;background:#eee center/cover;border-radius:14px;margin-bottom:10px}
.thumbs{display:flex;gap:6px;margin-bottom:10px}.thumbs div{width:54px;height:54px;border-radius:8px;background:#eee center/cover}
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--d);color:#fff;padding:10px 18px;border-radius:24px;font-size:14px;z-index:20}
/* location pill + popup */
.loc-pill{display:flex;align-items:center;gap:3px;height:30px;padding:0 8px 0 7px;border-radius:15px;background:var(--o2);border:1px solid #f26a0f26;font-size:12.5px;font-weight:600;color:var(--d);max-width:132px}
.loc-pill .ic{width:14px;height:14px;color:var(--o)}.loc-pill .chev{width:12px;height:12px;stroke-width:2.4}
.loc-pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:92px}
.brand>div{min-width:0}
@media(max-width:380px){.loc-pill{max-width:112px}.loc-pill span{max-width:72px}}
.rad{font-size:11px;color:var(--g);font-weight:500;margin-left:2px}
.dist{color:var(--o);font-size:11px;font-weight:600;margin-top:1px}
.hscroll .empty{flex:0 0 calc(100% - 16px);padding:22px 8px}
.empty .act{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.loc-sub{color:var(--g);font-size:13px;margin:-4px 0 12px}
.loc-cur{display:flex;align-items:center;gap:6px;background:var(--o2);padding:10px 12px;border-radius:12px;margin-bottom:12px}
.loc-cur small{margin-left:auto;color:var(--g)}
.loc-err{background:#fdecea;color:#b3261e;border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--g);font-size:12px;margin:14px 0 10px}
.or:before,.or:after{content:"";flex:1;height:1px;background:#e5dcd8}
.loc-q{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:10px;margin-bottom:8px}
.loc-list{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:220px;overflow:auto}
.area{display:flex;align-items:center;gap:6px;padding:9px 10px;border-radius:10px;background:var(--o2);font-size:13px;text-align:left}
.area .ic{width:14px;height:14px;color:var(--o)}.area.on{background:var(--o);color:#fff}.area.on .ic{color:#fff}
.hint{font-size:12px;color:var(--g);margin-top:-4px}

/* iOS: instant taps, no double-tap delay; fallback popup for browsers without <dialog> */
button,a,.area,.cat,.card{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.loc-pill{min-height:32px}
.dlg-poly{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:100;background:#fff;box-shadow:0 0 0 100vmax #0008}
.dlg-poly:not([open]){display:none}
/* liked products button in top bar */
</style>
</head>
