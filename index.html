<!DOCTYPE html>
<html lang="en">
<head>

<body>
<!-- 2D line-icon sprite -->

<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></symbol>

<symbol id="i-laptop" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.8"/><path d="M2 20h20"/></symbol>

<symbol id="i-flame" viewBox="0 0 24 24"><path d="M12 22c4 0 7-2.8 7-7 0-3-1.5-5-3-7 0 2-1 3-2.5 3 0-3-1.5-6-4.5-8 .5 3-1 5-2.5 7C5.5 11.5 5 13 5 15c0 4.2 3 7 7 7z"/></symbol>

<symbol id="i-palace" viewBox="0 0 24 24"><path d="M2 21h20M4 21V11h16v10M12 2v3M8.5 11c0-3.5 1.6-6 3.5-6s3.5 2.5 3.5 6M6 11V8M18 11V8M9.5 21v-4a2.5 2.5 0 0 1 5 0v4"/></symbol>

<div id="app">
  <header class="top">
    <div class="brand"><img src="https://i.ibb.co/qL84QwQm/A6-E453-B6-2581-4-D2-B-B99-F-C6-C82-FF4-FE6-A.png" alt=""><div><h1>AMD <span>Mart</span></h1><small>Ahmedabad Students' Marketplace</small></div></div>
    <div class="top-r">
      <button id="loc-btn" class="loc-pill" aria-label="Change location" title="Change location"><svg class="ic"><use href="#i-pin"/></svg><span id="loc-name">Select area</span><svg class="ic chev"><use href="#i-chev"/></svg></button>
      <button id="bell" class="icon-btn" aria-label="Notifications"><svg class="ic"><use href="#i-bell"/></svg><i id="dot" class="dot hidden"></i></button>
    </div>
  </header>

  <main>
    <section id="v-home" class="view">
      <div class="hero"><div><h2>From Students,<br><span>For Students.</span></h2><p>Buy <b>•</b> Sell <b>•</b> Reuse <b>•</b> Connect</p></div><svg class="ic hero-art"><use href="#i-palace"/></svg></div>
      <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="q-home" placeholder="Search for products, services…" readonly></label>
      <div id="cats" class="cats"></div>
      <div class="sec-h"><h3><svg class="ic o"><use href="#i-pin"/></svg>Nearby Deals <small class="rad">within 2 km</small></h3><a href="#" data-v="explore">View All →</a></div>
      <div id="nearby" class="hscroll"></div>
    </section>

    <section id="v-explore" class="view hidden">
      <label class="search"><svg class="ic"><use href="#i-search"/></svg><input id="q" placeholder="Search for products, services…" autocomplete="off"></label>
      <div id="chips" class="chips"></div>
      <div id="grid" class="grid"></div>
    </section>

    <section id="v-requests" class="view hidden"><h3 class="pad">Buying Requests</h3><div id="reqs" class="list"></div></section>
    <section id="v-profile" class="view hidden"><div id="profile"></div></section>
  </main>

  <nav class="nav">
    <button data-v="home" class="on"><svg class="ic"><use href="#i-home"/></svg>Home</button>
    <button data-v="explore"><svg class="ic"><use href="#i-grid"/></svg>Explore</button>
    <button id="fab" class="fab" aria-label="Sell your product"><span class="fab-c"><svg class="ic"><use href="#i-plus"/></svg></span>Sell your product</button>
    <button data-v="requests"><svg class="ic"><use href="#i-chat"/></svg>Requests</button>
    <button data-v="profile"><svg class="ic"><use href="#i-user"/></svg>Profile</button>
  </nav>
</div>

<dialog id="dlg"><button class="x" id="x" aria-label="Close">✕</button><div id="dlg-body"></div></dialog>
<div id="toast" class="toast hidden"></div>
<script type="module" src="script.js"></script>
</body>
</html>
